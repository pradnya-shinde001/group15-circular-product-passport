# Starts the web app in Docker with one command:
#     docker compose up --build                     (without photo identification)
#     INSTALL_CLIP=1 docker compose up --build      (with CLIP for photo identification)
# Then open http://localhost:8000.  Stop with Ctrl+C, or `docker compose down`.

services:
  app:
    build:
      context: .
      args:
        INSTALL_CLIP: ${INSTALL_CLIP:-0}
    image: circular-passport
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PASSPORT_BASE_URL: http://localhost:8000
    volumes:
      - passport-data:/data
      - clip-cache:/cache
    restart: unless-stopped

volumes:
  passport-data:
  clip-cache:
